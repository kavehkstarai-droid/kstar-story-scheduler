name: Verify HeyGen API access (no generation)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event.repository.visibility == 'public' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Test access checks without network access
        run: python3 -m unittest discover -s tests -p test_heygen_preflight.py -v
      - name: Check existing API funds without generating a video
        env:
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
        run: python3 heygen_preflight.py --fetch
